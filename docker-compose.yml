services:
  postgres:
    image: postgres:17
    container_name: scrum_copilot_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: scrum_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: scrum_copilot

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrum_user -d scrum_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: